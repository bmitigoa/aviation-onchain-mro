name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check off-chain Merkle tool matches committed example
        working-directory: tools
        run: |
          npm ci
          node build-batch.mjs examples/c-check-package.json /tmp/tree.json
          diff <(jq -S . /tmp/tree.json) <(jq -S . examples/c-check-package.tree.json)
